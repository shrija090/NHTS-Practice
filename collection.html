<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <header>
        <h1>BasicStore</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Cart (0)</a>
        </nav>
    </header>

    <!-- Main Section -->
    <div class="container">
        
        <!-- Sidebar Filters -->
        <aside>
            <div class="filter-group">
                <h3>Categories</h3>
                <label><input type="checkbox"> All Products</label>
                <label><input type="checkbox"> Clothing</label>
                <label><input type="checkbox"> Accessories</label>
                <label><input type="checkbox"> Footwear</label>
            </div>
            <div class="filter-group">
                <h3>Price Range</h3>
                <label><input type="checkbox"> Under $50</label>
                <label><input type="checkbox"> $50 - $100</label>
                <label><input type="checkbox"> Over $100</label>
            </div>
        </aside>

        <!-- Product Listing -->
        <div class="main-content">
            <div class="collection-header">
                <p>Showing 4 of 4 products</p>
                <select>
                    <option>Sort by: Featured</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                </select>
            </div>

            <div class="product-grid">
                <!-- Product 1 -->
                <div class="product-card">
                    <div class="product-image">Product Image</div>
                    <div class="product-info">
                        <div class="product-title">Classic T-Shirt</div>
                        <div class="product-price">$29.00</div>
                        <button class="btn-add">Add to Cart</button>
                    </div>
                </div>

                <!-- Product 2 -->
                <div class="product-card">
                    <div class="product-image">Product Image</div>
                    <div class="product-info">
                        <div class="product-title">Casual Denim Jacket</div>
                        <div class="product-price">$79.00</div>
                        <button class="btn-add">Add to Cart</button>
                    </div>
                </div>
                <!-- Product 3 -->
                <div class="product-card">
                    <div class="product-image">Product Image</div>
                    <div class="product-info">
                        <div class="product-title">Minimalist Watch</div>
                        <div class="product-price">$120.00</div>
                        <button class="btn-add">Add to Cart</button>
                    </div>
                </div>

                <!-- Product 4 -->
                <div class="product-card">
                    <div class="product-image">Product Image</div>
                    <div class="product-info">
                        <div class="product-title">Leather Sneakers</div>
                        <div class="product-price">$85.00</div>
                        <button class="btn-add">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    
</body>
</html>
